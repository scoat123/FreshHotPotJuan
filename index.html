<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鮮味愛喝湯 點餐系統</title>
<style>
:root{--bg:#f6efe6;--surf:#fff;--ink:#2a1a17;--mute:#7a6a65;--red:#c4161c;--red-d:#9d1015;--yel:#ffd52e;--line:#e6d9cc;--on-red:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1412;--surf:#2a1d1a;--ink:#f6e9e2;--mute:#b3a199;--red:#e0343a;--red-d:#c4161c;--line:#46342f}}
:root[data-theme="dark"]{--bg:#1d1412;--surf:#2a1d1a;--ink:#f6e9e2;--mute:#b3a199;--red:#e0343a;--red-d:#c4161c;--line:#46342f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:18px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
#app{display:grid;grid-template-columns:150px 1fr 360px;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/4;background:var(--red);color:var(--on-red);display:flex;align-items:center;gap:16px;padding:10px 20px}
header h1{margin:0;font-size:26px;letter-spacing:.08em}
header .tip{margin-left:auto;font-size:15px;background:rgba(0,0,0,.18);padding:6px 14px;border-radius:20px}
nav{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line)}
nav button{padding:16px 8px;border-radius:12px;font-weight:700;text-align:center;background:var(--surf);border:2px solid transparent;position:relative}
nav button.on{background:var(--yel);color:#2a1a17;border-color:var(--red)}
nav b{position:absolute;top:4px;right:6px;background:var(--red);color:#fff;font-size:13px;min-width:22px;height:22px;border-radius:11px;line-height:22px}
main{overflow:auto;padding:16px}
main h2{margin:0 0 4px;font-size:22px}
main .sub{margin:0 0 14px;color:var(--mute);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:104px;position:relative;text-align:left}
.card.has{border-color:var(--red)}
.card .nm{font-weight:700;font-size:19px;line-height:1.3}
.card .pr{margin-top:auto;font-size:22px;font-weight:800;color:var(--red)}
.card .pr small{font-size:14px;font-weight:500;color:var(--mute)}
.card:active{transform:scale(.98)}
.card .cnt{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;min-width:30px;height:30px;border-radius:15px;line-height:30px;text-align:center;font-weight:700}
.vs{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.vs button{flex:1;min-width:76px;padding:10px 6px;border-radius:10px;background:var(--bg);border:2px solid var(--line);font-weight:700;line-height:1.25}
.vs button em{display:block;font-style:normal;color:var(--red);font-size:19px}
.vs button:active{background:var(--yel);color:#2a1a17}
aside{background:var(--surf);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.mode{display:flex;gap:8px;padding:12px}
.mode button{flex:1;padding:12px;border-radius:10px;border:2px solid var(--line);font-weight:700}
.mode button.on{background:var(--red);border-color:var(--red);color:#fff}
.list{flex:1;overflow:auto;padding:0 12px}
.empty{color:var(--mute);text-align:center;margin-top:40px;line-height:1.7}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.row .n{font-weight:700}
.row .n span{color:var(--mute);font-weight:400;font-size:15px}
.row .t{font-weight:700;text-align:right}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:22px;background:var(--bg);border:2px solid var(--line);font-size:24px;font-weight:700;line-height:1}
.step i{min-width:28px;text-align:center;font-style:normal;font-weight:700}
.foot{padding:12px;border-top:2px solid var(--line)}
.warn{background:#fff3bf;color:#5c4400;border-radius:10px;padding:8px 12px;font-size:15px;margin-bottom:10px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;margin-bottom:10px}
.tot b{font-size:32px;color:var(--red)}
.acts{display:flex;gap:8px}
.acts .clr{padding:0 16px;border-radius:12px;border:2px solid var(--line);height:60px}
.acts .go{flex:1;height:60px;border-radius:12px;background:var(--red);color:#fff;font-size:21px;font-weight:800}
.acts .go:disabled{opacity:.4}
.ov{position:fixed;inset:0;background:rgba(20,8,6,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov.show{display:flex}
.dlg{background:var(--surf);border-radius:18px;padding:22px;width:min(560px,100%);max-height:100%;overflow:auto}
.dlg h3{margin:0 0 14px;font-size:24px}
.tbl{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 14px}
.tbl button{height:54px;border-radius:10px;border:2px solid var(--line);font-weight:700;font-size:20px}
.tbl button.on{background:var(--yel);color:#2a1a17;border-color:var(--red)}
.dlg input{width:100%;padding:14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:14px}
.dlg .acts button{height:56px}
.dlg .ghost{padding:0 22px;border-radius:12px;border:2px solid var(--line)}
.ok{text-align:center}
.ok .no{font-size:56px;font-weight:800;color:var(--red);margin:6px 0}
.ok ul{list-style:none;padding:0;margin:12px 0;text-align:left;max-height:30vh;overflow:auto}
.ok li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
#bar{display:none}
@media (max-width:900px){
 #app{grid-template-columns:110px 1fr;grid-template-rows:auto 1fr auto}
 header{grid-column:1/3}header .tip{display:none}
 aside{position:fixed;inset:0 0 0 auto;width:min(380px,100%);transform:translateX(100%);transition:transform .2s;z-index:10}
 aside.open{transform:none}
 #bar{display:flex;grid-column:1/3;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--red);color:#fff;font-weight:800;font-size:20px}
 #bar button{background:var(--yel);color:#2a1a17;padding:12px 22px;border-radius:12px;font-weight:800}
 .cls{display:block!important}
}
.cls{display:none;margin:12px 12px 0;padding:10px;border-radius:10px;border:2px solid var(--line)}
body[data-v="login"] #app,body[data-v="admin"] #app{display:none}
#login,#admin{display:none}
body[data-v="login"] #login{display:flex}
body[data-v="admin"] #admin{display:block}
#login{position:fixed;inset:0;background:var(--red);align-items:center;justify-content:center;padding:20px;z-index:30}
.lg{background:var(--surf);border-radius:20px;padding:28px;width:min(420px,100%)}
.lg h2{margin:0 0 6px;font-size:28px;text-align:center}
.seg{display:flex;gap:8px;margin:16px 0}
.seg button{flex:1;padding:16px;border-radius:12px;border:2px solid var(--line);font-weight:800;font-size:20px}
.seg button.on{background:var(--yel);color:#2a1a17;border-color:var(--red)}
.lg input{width:100%;padding:16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:22px;text-align:center;letter-spacing:.3em;margin-bottom:10px}
.lg .go{width:100%;height:60px;border-radius:12px;background:var(--red);color:#fff;font-size:21px;font-weight:800}
.err{color:var(--red);min-height:24px;text-align:center;font-weight:700}
.hr{margin-left:auto;display:flex;gap:10px;align-items:center}
.hb{padding:8px 16px;border-radius:20px;background:rgba(0,0,0,.25);color:#fff;font-weight:700}
#admin{height:100%;overflow:auto;padding:16px 20px}
.ah{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ah h1{margin:0;font-size:26px}.sp{flex:1}
.ah button,.pwf button{padding:12px 18px;border-radius:12px;border:2px solid var(--line);background:var(--surf);font-weight:700}
.ah .pri{background:var(--red);color:#fff;border-color:var(--red)}
.stats{display:flex;gap:12px;margin-bottom:16px}
.stats div{flex:1;background:var(--surf);border-radius:14px;padding:14px}
.stats b{display:block;font-size:30px;color:var(--red)}
.ord{background:var(--surf);border-radius:14px;padding:14px;margin-bottom:10px}
.ord .oh{display:flex;justify-content:space-between;font-weight:800}
.ord p{margin:6px 0 0;color:var(--mute);font-size:15px}
.pwf{background:var(--surf);border-radius:14px;padding:14px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.pwf label{flex:1;min-width:150px;font-size:15px;color:var(--mute)}
.pwf input{width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-top:4px}
.dots{display:flex;justify-content:center;gap:14px;height:40px;align-items:center}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--mute)}
.dots i.f{background:var(--red);border-color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 12px}
.pad button{height:72px;border-radius:16px;background:var(--bg);border:2px solid var(--line);font-size:30px;font-weight:800}
.pad button:active{background:var(--yel);color:#2a1a17}
.pad .fn{font-size:19px;color:var(--mute)}
@media (max-height:640px){.pad button{height:56px;font-size:24px}}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px}
body[data-v="kitchen"] #app{display:none}
#kitchen{display:none;height:100%;overflow:auto;padding:16px 20px;background:#17100f;color:#f6e9e2}
body[data-v="kitchen"] #kitchen{display:block}
#kitchen .ah button{background:#2a1d1a;color:#f6e9e2;border-color:#46342f}
#kitchen .empty{color:#b3a199}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tk.rd{border-left-color:#4aa3ff}
.pdlg{width:min(760px,100%)}
.pg{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:12px}
.pg h4{margin:0 0 8px;font-size:20px}
.pm{display:flex;gap:8px;margin-top:8px}
.pm button{flex:1;height:54px;border-radius:12px;background:var(--red);color:#fff;font-weight:800;font-size:18px}
.kb h2{margin:0 0 10px;font-size:22px}
.tk{background:#2a1d1a;border-radius:14px;padding:14px;margin-bottom:12px;border-left:8px solid #ffd52e}
.tk.late{border-left-color:#ff5a5f}.tk.mk{border-left-color:#4cc38a}
.tk .th{display:flex;justify-content:space-between;font-size:24px;font-weight:800}
.tk li{font-size:22px;padding:3px 0;list-style:none}
.tk .nt{background:#fff3bf;color:#5c4400;padding:6px 10px;border-radius:8px;font-size:17px}
.tk button{width:100%;height:60px;border-radius:12px;font-size:21px;font-weight:800;background:var(--red);color:#fff;margin-top:10px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:12px 20px;border-radius:12px;border:2px solid var(--line);background:var(--surf);font-weight:800}
.tabs button.on{background:var(--yel);color:#2a1a17;border-color:var(--red)}
.bar{height:14px;background:var(--red);border-radius:7px;min-width:2px}
.tb{width:100%;border-collapse:collapse;background:var(--surf);border-radius:12px}
.tb td,.tb th{padding:10px;border-bottom:1px dashed var(--line);text-align:left}
.tb td:last-child,.tb th:last-child{text-align:right}
.dt{padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font:inherit}
h3{margin:18px 0 8px}
.mi{display:flex;align-items:center;gap:12px;background:var(--surf);border-radius:12px;padding:10px;margin-bottom:8px}
.mi img,.mi .ph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--bg)}
.mi .nm{flex:1;font-weight:700}.mi .nm small{display:block;color:var(--mute);font-weight:400}
.mi.off{opacity:.6}
.tg{padding:12px 16px;border-radius:10px;border:2px solid var(--line);font-weight:700;min-height:48px}
.tg.on{background:#2e9e5b;color:#fff;border-color:#2e9e5b}
.tag{font-size:13px;padding:2px 8px;border-radius:8px;background:var(--bg);font-weight:500}
.dlg label{display:block;margin:0 0 6px;color:var(--mute);font-size:15px}
.dlg select{width:100%;padding:14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:14px}
.vr{display:flex;gap:8px;margin-bottom:8px}.dlg .vr input{margin:0}
.vr img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.ir{display:flex;gap:8px;align-items:center;margin-bottom:8px}.ir img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.fl{display:inline-flex;align-items:center;padding:0 18px;height:48px;border-radius:12px;border:2px solid var(--line);font-weight:700;cursor:pointer;margin:0;color:var(--ink)}
.ghost{height:48px}
.dlg label.fl{display:inline-flex;margin:0}
#exitGuest{display:none}
body.guest #exitGuest{display:inline-block}
body.guest #toPay,body.guest #toGuest,body.guest #out,body.guest #toAdmin,body.guest .tip,body.guest .mode{display:none!important}
body.guest .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
body.guest .card .nm{font-size:22px}
body.guest nav button{font-size:20px;padding:22px 8px}
.card.g{padding:10px}
.pic{position:relative;width:100%;padding:0;border-radius:12px;overflow:hidden;display:block;background:var(--bg)}
.pic .zi{position:absolute;right:8px;bottom:8px;font-style:normal;background:rgba(0,0,0,.55);border-radius:50%;width:36px;height:36px;line-height:36px;text-align:center;font-size:18px}
.tile{display:flex;align-items:center;justify-content:center;aspect-ratio:16/10;width:100%;font-size:68px;background:var(--bg)}
.ic{font-size:22px}
.mi .ph{display:flex;align-items:center;justify-content:center;font-size:30px}
.zm{position:relative;text-align:center;width:min(640px,100%)}
.zm img{width:100%;max-height:55vh;object-fit:contain;border-radius:14px;background:var(--bg)}
.zm .bigic{font-size:140px;line-height:1.3;background:var(--bg);border-radius:14px}
.zm .vs{justify-content:center}
.zm .vs button{min-width:140px;padding:16px}
.xz{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:24px;background:rgba(0,0,0,.6);color:#fff;font-size:22px;z-index:2}
#zoom{z-index:25}
.seg small{display:block;font-weight:400;font-size:14px;opacity:.85;margin-top:4px}
.kw{display:flex;gap:14px;align-items:flex-start}
.kq{flex:0 0 210px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.qi{display:block;width:100%;background:#2a1d1a;color:#f6e9e2;border-radius:12px;padding:10px 12px;text-align:left;border-left:8px solid #ffd52e}
.qi.st1{border-color:#4cc38a}.qi.st2{border-color:#4aa3ff}.qi.sel{outline:3px solid #fff}
.qi b{font-size:22px}.qi small{display:block;opacity:.75}
.kf{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.fh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0}
.fn{font-size:34px;font-weight:800}.ft{font-size:30px;font-weight:800;color:#ffd52e;margin-left:10px}
.fm{display:block;color:#b3a199}
.act{height:64px;padding:0 28px;border-radius:14px;font-size:22px;font-weight:800;background:var(--red);color:#fff}
.nt.big{font-size:20px;font-weight:700;margin:6px 0}
.kmap{column-count:2;column-gap:10px;margin-top:6px}
.kfit{flex:1;min-height:0;position:relative;overflow:hidden}
.kfit .kmap{position:absolute;top:0;transform-origin:0 0;margin:0}
body[data-v="kitchen"] #kitchen.sv{display:flex;flex-direction:column;overflow:hidden}
.sv .kw{flex:1;min-height:0;align-items:stretch}
.kx{break-inside:avoid}
#kitchen .tag{background:#46342f;color:#f6e9e2}
.kcol{display:flex;flex-direction:column;gap:10px}
.ks{background:#241816;border-radius:12px;overflow:hidden;border:3px solid transparent;break-inside:avoid;margin-bottom:10px}
.ks.has{border-color:#ffd52e}
.ks h4{margin:0;padding:6px 10px;background:#ffd52e;color:#2a1a17;font-size:18px;display:flex;justify-content:space-between;align-items:center;opacity:.5}
.ks.has h4{opacity:1}
.sn{background:#c4161c;color:#fff;border-radius:12px;min-width:28px;text-align:center;padding:0 8px}
.kg{display:grid;grid-auto-flow:column;gap:2px 6px;padding:6px}
.kc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px;padding:5px 8px;border-radius:8px;font-size:16px;opacity:.38;min-height:36px}
.kc.on{opacity:1;background:#ffd52e;color:#2a1a17;font-weight:800;font-size:18px;box-shadow:0 0 0 2px #c4161c}
.qt{background:#c4161c;color:#fff;border-radius:10px;padding:0 8px;font-size:18px}
.kc.mv{flex-direction:column;align-items:flex-start}
.vcs{display:flex;gap:6px;flex-wrap:wrap}
.vc{border:1.5px solid currentColor;border-radius:8px;padding:1px 8px;font-size:14px;font-weight:600}
.kc.on .vc{opacity:.45}
.kc.on .vc.on{opacity:1;background:#c4161c;color:#fff;border-color:#c4161c;font-weight:800;font-size:16px}
.kx{margin-top:10px;background:#fff3bf;color:#5c4400;padding:8px 12px;border-radius:8px}
@media (max-width:900px){.kw{flex-direction:column}.kq{flex:none;position:static;flex-direction:row;overflow:auto;max-height:none;width:100%}.qi{min-width:150px}.kmap{grid-template-columns:1fr}}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
.kcard{background:#241816;border-radius:12px;padding:10px;border-top:8px solid #ffd52e}
.kcard.st1{border-top-color:#4cc38a}.kcard.st2{border-top-color:#4aa3ff}
.fh2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fn2{font-size:26px}.ft2{font-size:22px;font-weight:800;color:#ffd52e;margin-left:6px}
.act2{height:48px;padding:0 14px;border-radius:12px;font-weight:800;font-size:17px;background:var(--red);color:#fff}
.kall .kmap{gap:6px}.kall .kcol{gap:6px}
.kall .ks h4{font-size:12px;padding:3px 6px}
.kall .kg{padding:3px;gap:1px 3px}
.kall .kc{font-size:11px;padding:2px 4px;min-height:18px}
.kall .kc.on{font-size:13px}
.kall .vc{font-size:10px;padding:0 5px}.kall .kc.on .vc.on{font-size:12px}
.kall .qt{font-size:12px;padding:0 6px}
.kall .nt.big{font-size:15px}
@keyframes fl{0%,100%{box-shadow:inset 0 0 0 0 #ffd52e}50%{box-shadow:inset 0 0 0 14px #ffd52e}}
#kitchen.flash{animation:fl .8s 4}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-v="login">
<div id="app">
 <header><h1>鮮味愛喝湯 <small id="gt"></small></h1><span class="hr"><span class="tip">點選品項加入 · 右側確認後送出</span><button class="hb" id="toPay">結帳</button><button class="hb" id="toGuest">客人點餐</button><button class="hb" id="toAdmin">回後台</button><button class="hb" id="exitGuest">🔒 店員</button><button class="hb" id="out">登出</button></span></header>
 <nav id="nav" aria-label="菜單分類"></nav>
 <main id="main"></main>
 <aside id="cart">
  <button class="cls" id="cls">收起訂單</button>
  <div class="mode" id="mode"></div>
  <div class="list" id="list"></div>
  <div class="foot">
   <div id="warn"></div>
   <div class="tot"><span>合計</span><b id="tot">$0</b></div>
   <div class="acts"><button class="clr" id="clr">清空</button><button class="go" id="go">送出訂單</button></div>
  </div>
 </aside>
 <div id="bar"><span id="barTxt">尚未點餐</span><button id="barBtn">查看訂單</button></div>
</div>
<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>
