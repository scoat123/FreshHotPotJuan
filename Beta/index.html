<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 5 秒後自動跳轉（備用機制） -->
    <meta http-equiv="refresh" content="5;url=http://tinyurl.com/teresasu0831">
    <title>鮮味愛喝湯 - 系統已更新至正式版</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #fdf8f2;
            color: #333;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            border-top: 6px solid #d97706;
        }
        .badge {
            display: inline-block;
            background-color: #fef3c7;
            color: #b45309;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 1.5rem;
            color: #1f2937;
            margin: 0 0 12px 0;
        }
        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #4b5563;
            margin: 0 0 16px 0;
        }
        .url-container {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            padding: 12px;
            border-radius: 8px;
            margin: 16px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .url-text {
            font-family: monospace;
            font-size: 0.95rem;
            color: #111827;
            word-break: break-all;
            text-align: left;
        }
        .copy-btn {
            background-color: #e5e7eb;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.8rem;
            color: #374151;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
        }
        .copy-btn:active {
            background-color: #d1d5db;
        }
        .countdown-text {
            font-size: 0.95rem;
            color: #d97706;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .go-btn {
            display: block;
            width: 100%;
            background-color: #d97706;
            color: white;
            text-decoration: none;
            padding: 14px 0;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        .go-btn:hover {
            background-color: #b45309;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">系統公告</div>
        <h1>🍲 鮮味愛喝湯<br>已正式上線囉！</h1>
        <p>感謝您的使用，「雲端測試版」已功成身退。請記得將下方的<strong>正式版網址</strong>加入書籤或桌面捷徑，避免下次找不到點餐畫面喔！</p>
        
        <div class="url-container">
            <span class="url-text" id="target-url">http://tinyurl.com/teresasu0831</span>
            <button class="copy-btn" onclick="copyUrl()" id="copy-btn">複製</button>
        </div>

        <div class="countdown-text">
            ⏳ <span id="countdown">5</span> 秒後自動進入正式點餐頁面...
        </div>

        <a href="http://tinyurl.com/teresasu0831" class="go-btn">立即前往正式版點餐</a>
    </div>

    <script>
        const targetUrl = "http://tinyurl.com/teresasu0831";
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');

        // 倒數計時與自動跳轉
        const timer = setInterval(() => {
            seconds--;
            if (seconds >= 0) {
                countdownEl.textContent = seconds;
            }
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.replace(targetUrl);
            }
        }, 1000);

        // 一鍵複製網址功能
        function copyUrl() {
            navigator.clipboard.writeText(targetUrl).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.textContent = "已複製！";
                btn.style.backgroundColor = "#10b981";
                btn.style.color = "white";
                setTimeout(() => {
                    btn.textContent = "複製";
                    btn.style.backgroundColor = "#e5e7eb";
                    btn.style.color = "#374151";
                }, 2000);
            });
        }
    </script>
</body>
</html>
